services:
  postgres:
    image: postgres:16-alpine
    container_name: meddra-postgres
    environment:
      POSTGRES_USER: meddra
      POSTGRES_PASSWORD: meddra
      POSTGRES_DB: meddra
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
